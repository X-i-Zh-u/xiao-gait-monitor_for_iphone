<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6f8">
  <title>GAIT iPhone 蓝牙采集</title>
  <link rel="stylesheet" href="./style.css?v=2">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">G</span>
      <div><strong>GAIT / MOBILE</strong><small>双鞋 BLE 实时采集</small></div>
    </div>
    <span class="browser-state" id="browser-state">检查蓝牙能力…</span>
  </header>

  <main>
    <section class="intro">
      <div>
        <div class="eyebrow">XIAO nRF52840 SENSE · ADS122C04</div>
        <h1>由 iPhone 直接接收两只鞋的数据</h1>
        <p>请使用 Bluefy 打开本页面。首次连接时，左右鞋需要分别在系统设备列表中选择一次。</p>
      </div>
      <div class="window-label"><strong>10<span>s</span></strong><small>实时曲线窗口</small></div>
    </section>

    <section class="connections" aria-label="蓝牙连接控制">
      <article class="connection-card" id="connection-0">
        <div><span class="side-letter left">L</span><strong>左鞋</strong><small>GAIT-L</small></div>
        <span class="badge" id="badge-0">未连接</span>
        <button id="connect-0">选择并连接</button>
        <button id="disconnect-0" class="secondary" disabled>断开</button>
      </article>
      <article class="connection-card" id="connection-1">
        <div><span class="side-letter right">R</span><strong>右鞋</strong><small>GAIT-R</small></div>
        <span class="badge" id="badge-1">未连接</span>
        <button id="connect-1">选择并连接</button>
        <button id="disconnect-1" class="secondary" disabled>断开</button>
      </article>
    </section>

    <section class="recording" aria-label="数据保存控制">
      <div class="recording-copy">
        <span class="record-dot" id="record-dot"></span>
        <div><strong id="record-title">尚未开始记录</strong><small id="record-detail">连接鞋子后可记录并导出一个双鞋 CSV 文件</small></div>
      </div>
      <div class="record-actions">
        <button id="record-start" disabled>开始记录</button>
        <button id="record-stop" class="secondary" disabled>停止并生成CSV</button>
        <button id="record-save" class="button-link" hidden>保存/分享CSV</button>
      </div>
    </section>

    <div class="notice" id="notice" role="status">请先给两只鞋上电，然后分别点击“选择并连接”。</div>
    <section class="shoe-grid" id="shoe-grid" aria-label="左右鞋实时数据"></section>

    <footer>
      <span>采样仍为每鞋 50 Hz；固件每两个样本合并成一次 112 字节通知。</span>
      <span>曲线只连接现有样本，不生成或补写缺失数据。</span>
    </footer>
  </main>
  

  <script src="./protocol.js?v=2"></script>
  <script src="./app.js?v=2"></script>
</body>
</html>
